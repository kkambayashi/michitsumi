# ライブラリの新しい版が出ていたら、月に 1 回、Dependabot に更新の PR を出してもらう。
# 一人で見るので、種類ごとに 1 つの PR にまとめる（PR では CI が走るので、通ればそのまま取り込める）。
version: 2
updates:
  # Gradle：core・app・server（ルートの settings.gradle.kts）と、版の一覧 gradle/libs.versions.toml。Gradle 本体（wrapper）も含む
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: monthly
    groups:
      gradle:
        patterns: ["*"]

  # CI（.github/workflows）で使っている actions/checkout などの版
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns: ["*"]
